name: Cleanup-Release-Assets

on:
  schedule:
    - cron: 30 1 * * 1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-release-assets:
    name: Keep the latest 3 builds per tag
    runs-on: ubuntu-24.04
    steps:
      - name: Prune release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
          }

          def call(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req) as resp:
                  body = resp.read()
                  return json.loads(body) if body else None

          def pages(url):
              out = []
              while url:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as resp:
                      out += json.load(resp)
                      match = re.search(r'<([^>]+)>; rel="next"', resp.headers.get("Link", ""))
                      url = match.group(1) if match else None
              return out

          for rel in pages(f"{api}/releases?per_page=100"):
              assets = pages(f"{api}/releases/{rel['id']}/assets?per_page=100")
              if not assets:
                  continue

              # Assets are named <upstream>-<platform>-<version>-<date>-<suffix>;
              # group by that date. Fall back to the creation date.
              groups = {}
              for asset in assets:
                  match = re.search(r"(\d{4}-\d{2}-\d{2})", asset["name"])
                  key = match.group(1) if match else asset["created_at"][:10]
                  groups.setdefault(key, []).append(asset)

              keep = sorted(groups)[-3:]
              for key in sorted(groups):
                  if key in keep:
                      continue
                  for asset in groups[key]:
                      call(f"{api}/releases/assets/{asset['id']}", method="DELETE")
                      print(f"deleted {rel['tag_name']}: {asset['name']}")
              print(f"{rel['tag_name']}: kept {', '.join(keep)}")
          PY
